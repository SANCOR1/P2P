<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Plan en Plan - Comunidad Creativa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, h2, h3, h4, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            animation: marquee 30s linear infinite;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-[#FAF9F6] text-stone-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icon Components (Inline SVG for reliability) ---
        const IconUser = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconHeart = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>;
        const IconSparkles = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>;
        const IconMusic = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>;
        const IconScissors = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M7 11a3 3 0 101.5-5.598 3 3 0 00-1.5 5.598zm0 0l6 6m1 1a3 3 0 101.5-5.598 3 3 0 00-1.5 5.598zm0 0l-6-6"></path></svg>;
        const IconSend = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>;

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [formStatus, setFormStatus] = useState('');

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const team = [
                { name: "Coordinadora 1", role: "Gestión y Estrategia", icon: <IconUser />, color: "bg-rose-100 text-rose-600" },
                { name: "Coordinadora 2", role: "Comunidad y Logística", icon: <IconHeart />, color: "bg-orange-100 text-orange-600" },
                { name: "Profesor de Danza", role: "Expresión Corporal", icon: <IconMusic />, color: "bg-amber-100 text-amber-600" },
                { name: "Profesor de Maquillaje", role: "Arte Estético", icon: <IconSparkles />, color: "bg-teal-100 text-teal-600" },
                { name: "Profesor de Bordados", role: "Textiles y Tradición", icon: <IconScissors />, color: "bg-stone-200 text-stone-600" },
            ];

            const workshops = [
                { title: "Danza Contemporánea", result: "Exploración del movimiento y liberación emocional.", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&q=80&w=800" },
                { title: "Maquillaje Profesional", result: "Transformación y resalte de la belleza natural.", img: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&q=80&w=800" },
                { title: "Bordado Creativo", result: "Creación de piezas únicas con hilos y texturas.", img: "https://images.unsplash.com/photo-1517210122415-b0c70b2a09bf?auto=format&fit=crop&q=80&w=800" }
            ];

            const plans = ["Yoga al Aire Libre", "Cata de Vinos y Arte", "Senderismo Femenino", "Taller de Escritura", "Noche de Cine", "Clase de Cerámica"];

            const handleSubmit = (e) => {
                e.preventDefault();
                setFormStatus('success');
                setTimeout(() => setFormStatus(''), 3000);
            };

            return (
                <div className="min-h-screen">
                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'glass-nav py-3 shadow-md border-b border-stone-100' : 'bg-transparent py-6'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <h1 className="text-xl md:text-2xl font-bold tracking-tighter text-rose-600 uppercase">De Plan en Plan</h1>
                            <div className="hidden md:flex space-x-10 text-[10px] font-bold uppercase tracking-[0.2em] text-stone-500">
                                <a href="#inicio" className="hover:text-rose-500 transition-colors">Inicio</a>
                                <a href="#equipo" className="hover:text-rose-500 transition-colors">Equipo</a>
                                <a href="#talleres" className="hover:text-rose-500 transition-colors">Talleres</a>
                                <a href="#planes" className="hover:text-rose-500 transition-colors">Planes</a>
                                <a href="#unirse" className="text-rose-600 border-b-2 border-rose-600 pb-1">Unirse</a>
                            </div>
                            <button className="md:hidden text-stone-800">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                            </button>
                        </div>
                    </nav>

                    {/* Banner 1: Hero */}
                    <section id="inicio" className="relative min-h-screen flex items-center pt-20 overflow-hidden">
                        <div className="absolute top-20 right-[-5%] w-[40%] h-[70%] bg-rose-100 rounded-full blur-[120px] opacity-40 -z-10"></div>
                        <div className="container mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
                            <div className="space-y-10">
                                <div className="inline-flex items-center space-x-2 px-4 py-2 bg-white border border-stone-100 rounded-full shadow-sm">
                                    <span className="w-2 h-2 bg-rose-500 rounded-full animate-pulse"></span>
                                    <span className="text-[10px] font-bold uppercase tracking-widest text-stone-400">Iniciativa de Talleres 2024</span>
                                </div>
                                <h2 className="text-6xl md:text-8xl font-serif leading-[1.1] text-stone-900">
                                    Un espacio <br />
                                    <span className="italic text-rose-500">para ser tú.</span>
                                </h2>
                                <p className="text-lg text-stone-500 max-w-md leading-relaxed font-light">
                                    De Plan en Plan es una comunidad diseñada por y para mujeres. Aquí, la visibilidad de nuestros talentos y la sororidad se entrelazan en cada actividad.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4">
                                    <a href="#unirse" className="bg-stone-900 text-white px-10 py-5 rounded-full font-bold text-xs uppercase tracking-widest hover:bg-rose-600 transition-all text-center shadow-xl shadow-stone-200">
                                        Comenzar Ahora
                                    </a>
                                </div>
                            </div>
                            <div className="relative group">
                                <div className="relative z-10 rounded-[3rem] overflow-hidden shadow-2xl transition-transform duration-700 group-hover:scale-[1.02]">
                                    <img src="https://images.unsplash.com/photo-1516062423079-7ca13cdc7f5a?auto=format&fit=crop&q=80&w=800" alt="Mujeres colaborando" className="w-full aspect-[4/5] object-cover" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-stone-900/40 to-transparent"></div>
                                </div>
                                <div className="absolute -bottom-8 -left-8 bg-white p-8 rounded-[2rem] shadow-2xl z-20 hidden lg:block border border-stone-50">
                                    <div className="flex items-center space-x-6">
                                        <div className="bg-rose-50 p-4 rounded-2xl"><IconHeart /></div>
                                        <div>
                                            <p className="font-serif text-3xl font-bold text-stone-900">+250</p>
                                            <p className="text-[10px] font-bold uppercase tracking-widest text-stone-400">Mujeres Activas</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Banner 2: Misión */}
                    <section className="bg-stone-950 py-32 relative overflow-hidden">
                        <div className="container mx-auto px-6 text-center max-w-5xl relative z-10">
                            <h3 className="text-4xl md:text-5xl font-serif text-white mb-12 italic leading-snug">
                                "Nuestra organización democratiza el acceso al arte y el bienestar personal, creando puentes entre expertas y mujeres con ganas de aprender."
                            </h3>
                            <p className="text-stone-400 text-xl font-light leading-relaxed mb-16 max-w-3xl mx-auto">
                                Somos la suma de cada pincelada, cada paso de baile y cada puntada. Un refugio donde la creatividad no tiene límites y cada plan es una oportunidad de conexión.
                            </p>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-12 pt-16 border-t border-white/10">
                                {[
                                    {val: "15+", label: "Talleres"},
                                    {val: "05", label: "Mentorías"},
                                    {val: "100%", label: "Seguridad"},
                                    {val: "24/7", label: "Soporte"}
                                ].map((stat, i) => (
                                    <div key={i}>
                                        <p className="text-4xl font-serif text-rose-500 mb-2">{stat.val}</p>
                                        <p className="text-[10px] uppercase tracking-widest text-stone-500 font-bold">{stat.label}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-rose-900 rounded-full blur-[150px]"></div>
                        </div>
                    </section>

                    {/* Profiles Section */}
                    <section id="equipo" className="py-32 bg-white">
                        <div className="container mx-auto px-6">
                            <div className="flex flex-col md:flex-row justify-between items-end mb-20 gap-8">
                                <div className="max-w-2xl">
                                    <h2 className="text-5xl font-serif mb-6 text-stone-900">Nuestras Guías</h2>
                                    <p className="text-stone-500 text-lg font-light italic">Las mentes brillantes detrás de cada experiencia en De Plan en Plan.</p>
                                </div>
                                <div className="h-[1px] flex-grow bg-stone-100 mb-4 mx-8 hidden md:block"></div>
                            </div>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-10">
                                {team.map((member, i) => (
                                    <div key={i} className="group">
                                        <div className={`${member.color} aspect-[3/4] rounded-[2.5rem] mb-8 flex items-center justify-center transition-all duration-500 group-hover:-translate-y-4 shadow-sm group-hover:shadow-2xl relative overflow-hidden`}>
                                            <div className="scale-150 opacity-20 group-hover:scale-[2] transition-transform duration-700">{member.icon}</div>
                                            <div className="absolute inset-0 flex items-center justify-center text-current">{member.icon}</div>
                                        </div>
                                        <h4 className="text-2xl font-serif text-stone-900 group-hover:text-rose-600 transition-colors">{member.name}</h4>
                                        <p className="text-[10px] font-bold uppercase tracking-widest text-stone-400 mt-2">{member.role}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Workshops Section */}
                    <section id="talleres" className="py-32 bg-[#F9F8F6]">
                        <div className="container mx-auto px-6">
                            <div className="text-center mb-24 space-y-4">
                                <h2 className="text-5xl font-serif text-stone-900">Experiencias y Resultados</h2>
                                <p className="text-stone-400 font-light italic text-lg">Testimonios visuales de nuestra evolución creativa.</p>
                            </div>

                            <div className="grid md:grid-cols-3 gap-16">
                                {workshops.map((ws, i) => (
                                    <div key={i} className="bg-white rounded-[3rem] overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500 border border-stone-50 group">
                                        <div className="h-80 overflow-hidden relative">
                                            <img src={ws.img} alt={ws.title} className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />
                                            <div className="absolute inset-0 bg-stone-900/10 group-hover:bg-transparent transition-colors"></div>
                                        </div>
                                        <div className="p-12">
                                            <h4 className="text-3xl font-serif mb-6 text-stone-900">{ws.title}</h4>
                                            <p className="text-stone-500 leading-relaxed italic mb-8">"{ws.result}"</p>
                                            <button className="text-rose-500 text-xs font-bold uppercase tracking-widest flex items-center space-x-3 group/btn">
                                                <span>Ver Galería</span>
                                                <span className="group-hover/btn:translate-x-2 transition-transform">→</span>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Scrolling Banner */}
                    <section id="planes" className="py-24 bg-rose-600 overflow-hidden relative">
                        <div className="flex animate-marquee whitespace-nowrap items-center">
                            {[...plans, ...plans].map((plan, i) => (
                                <div key={i} className="flex items-center mx-12">
                                    <span className="text-white text-5xl md:text-7xl font-serif italic tracking-tight">{plan}</span>
                                    <span className="mx-12 text-rose-300">✦</span>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Registration Form */}
                    <section id="unirse" className="py-32 bg-white">
                        <div className="container mx-auto px-6">
                            <div className="max-w-6xl mx-auto flex flex-col lg:flex-row rounded-[4rem] overflow-hidden shadow-[0_50px_100px_-20px_rgba(0,0,0,0.1)] border border-stone-50">
                                <div className="lg:w-2/5 p-16 md:p-24 bg-rose-50 flex flex-col justify-center">
                                    <h2 className="text-5xl font-serif mb-8 text-stone-900 leading-tight">Tu espacio <br/>te espera.</h2>
                                    <p className="text-stone-500 text-lg mb-12 font-light leading-relaxed">
                                        Completa tus datos para recibir la agenda mensual de talleres y beneficios exclusivos para la comunidad.
                                    </p>
                                    <div className="space-y-6">
                                        <div className="flex items-center space-x-4">
                                            <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><IconHeart /></div>
                                            <span className="text-sm font-semibold text-rose-600 italic">@deplanenplan</span>
                                        </div>
                                        <p className="text-[10px] uppercase tracking-widest font-bold text-stone-400 mt-4">Bogotá, Colombia • 2024</p>
                                    </div>
                                </div>
                                
                                <div className="lg:w-3/5 p-16 md:p-24 bg-white relative">
                                    {formStatus === 'success' ? (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 animate-in fade-in duration-500">
                                            <div className="w-20 h-20 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mb-6">
                                                <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                            <h4 className="text-3xl font-serif mb-2">¡Bienvenida!</h4>
                                            <p className="text-stone-400">Te hemos enviado un correo de bienvenida.</p>
                                        </div>
                                    ) : (
                                        <form className="space-y-10" onSubmit={handleSubmit}>
                                            <div className="grid md:grid-cols-2 gap-10">
                                                <div className="relative">
                                                    <input type="text" required className="w-full border-b-2 border-stone-100 py-4 focus:border-rose-500 outline-none transition-colors bg-transparent peer" placeholder=" " />
                                                    <label className="absolute left-0 top-4 text-stone-400 text-xs uppercase tracking-widest font-bold pointer-events-none transition-all peer-focus:-top-4 peer-focus:text-rose-500 peer-[:not(:placeholder-shown)]:-top-4">Nombre Completo</label>
                                                </div>
                                                <div className="relative">
                                                    <input type="email" required className="w-full border-b-2 border-stone-100 py-4 focus:border-rose-500 outline-none transition-colors bg-transparent peer" placeholder=" " />
                                                    <label className="absolute left-0 top-4 text-stone-400 text-xs uppercase tracking-widest font-bold pointer-events-none transition-all peer-focus:-top-4 peer-focus:text-rose-500 peer-[:not(:placeholder-shown)]:-top-4">Tu Correo</label>
                                                </div>
                                            </div>
                                            <div className="relative">
                                                <select className="w-full border-b-2 border-stone-100 py-4 focus:border-rose-500 outline-none transition-colors bg-transparent appearance-none cursor-pointer text-stone-600">
                                                    <option>Selecciona tu taller favorito</option>
                                                    <option>Danza Contemporánea</option>
                                                    <option>Maquillaje</option>
                                                    <option>Bordado</option>
                                                </select>
                                                <div className="absolute right-0 top-6 pointer-events-none">
                                                    <svg className="w-4 h-4 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                                                </div>
                                            </div>
                                            <div className="pt-8">
                                                <button className="w-full bg-rose-600 text-white py-6 rounded-[2rem] font-bold uppercase tracking-[0.2em] text-[10px] flex items-center justify-center space-x-4 hover:bg-rose-700 transition-all shadow-2xl shadow-rose-200 group">
                                                    <span>Enviar Solicitud</span>
                                                    <IconSend />
                                                </button>
                                            </div>
                                        </form>
                                    )}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-stone-50 py-20 border-t border-stone-100">
                        <div className="container mx-auto px-6 text-center">
                            <h2 className="text-2xl font-bold tracking-tighter text-stone-300 mb-10 uppercase">De Plan en Plan</h2>
                            <div className="flex justify-center space-x-12 mb-12">
                                {['Instagram', 'Facebook', 'LinkedIn', 'Pinterest'].map(social => (
                                    <a key={social} href="#" className="text-[10px] font-bold uppercase tracking-widest text-stone-400 hover:text-rose-500 transition-colors">{social}</a>
                                ))}
                            </div>
                            <p className="text-stone-300 text-[10px] uppercase tracking-widest">© 2024 DE PLAN EN PLAN • COMUNIDAD CREATIVA • BOGOTÁ</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
